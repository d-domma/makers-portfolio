<div class="forum-container">
  
<div class="bot-container">
  <div class="forum-container">
    
    <div class="sidebar">
      <div class="faq-header" (click)="toggleFAQ()">
        <h2>Frequently Asked Questions</h2>
      </div>
      <ul id="faqList" class="faq-list">
        <li (click)="goToFAQPage('/organizer')">Where do I add a transaction?</li>
        <li (click)="goToFAQPage('/track')">Where do I get a report?</li>
        <li (click)="goToFAQPage('/trends')">Where are the stock prices?</li>
      </ul>
    </div>

    
    <div class="main-content">
      
      <div class="top-section">
        <input type="text" class="search-bar" [(ngModel)]="lookup" (ngModelChange)="runLookup()" placeholder="Search your transactions, tasks, and notes">
        <div *ngIf="hits.length">
          <p *ngFor="let hit of hits">{{ hit }}</p>
        </div>
        <div class="profile-section">
          <img src="assets/john.jpg" alt="Profile Image" class="profile-pic">
          <div class="profile-info">
            <h3>{{ displayName }}</h3>
            <p>{{ displayLine }}</p>
          </div>
        </div>
      </div>

      
      <div class="chat-container">
        <div class="chat-section" id="chatSection">
          <div *ngFor="let message of messages" class="message-card" [ngStyle]="{'background-color': message.bgColor}">
            <div class="message-header">
              <img [src]="message.profilePic" alt="{{ message.username }}'s Profile Picture" class="user-pic">
              <h4>{{ message.username }}</h4>
            </div>
            <p>{{ message.text }}</p>
          </div>
        </div>        
      </div>
    </div>
  </div>

  
  <div class="chat-input">
    <input type="text" id="userMessage" placeholder="Type a message..." (keyup.enter)="sendMessage()">
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
